<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiador de Balanza Aspel COI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 x=%222%22 font-size=%2285%22>⚖️</text></svg>">
    <!-- Cargamos las librerías desde CDNs confiables -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drop-zone {
            border: 2px dashed #cbd5e1;
            transition: all 0.3s ease;
        }
        .drop-zone.drag-over {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        /* Aseguramos que el cuerpo ocupe toda la pantalla */
        body {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-900">

    <div class="max-w-4xl mx-auto py-12 px-4">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-800 mb-2">Limpiador de Balanza COI</h1>
            <p class="text-slate-600">Herramienta de limpieza profesional para reportes de Aspel COI.</p>
        </div>

        <!-- Panel de Configuración -->
        <div class="bg-white rounded-xl p-6 shadow-md border border-slate-200 mb-6 text-sm">
            <h2 class="text-lg font-bold mb-4 text-blue-700 border-b pb-2">Configuración de Estructura</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block font-semibold text-slate-700 mb-2">Estructura de Cuentas:</label>
                    <input type="text" id="structureInput" value="XXXX-XXX-XXX-XXX" 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg font-mono focus:ring-2 focus:ring-blue-500 outline-none">
                    <p class="text-xs text-slate-500 mt-1">Usa 'X' para representar dígitos.</p>
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-2">Patrón de Mayor (Negritas):</label>
                    <input type="text" id="patternInput" value="-000-000-000" 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg font-mono focus:ring-2 focus:ring-blue-500 outline-none">
                    <p class="text-xs text-slate-500 mt-1">Cuentas que contengan esto se verán más grandes.</p>
                </div>
            </div>
        </div>

        <!-- Zona de Carga -->
        <div id="dropZone" class="drop-zone bg-white rounded-xl p-16 text-center cursor-pointer shadow-md hover:shadow-lg transition-shadow">
            <div class="flex flex-col items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-blue-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <p class="text-xl font-bold text-slate-700">Arrastra tu Balanza de COI aquí</p>
                <p class="text-slate-500 mt-2">o haz clic para seleccionar el archivo</p>
                <input type="file" id="fileInput" class="hidden" accept=".xlsx, .xls">
            </div>
        </div>

        <!-- Estado y Descarga -->
        <div id="statusContainer" class="mt-8 hidden">
            <div class="bg-white rounded-xl p-6 shadow-md border border-slate-200">
                <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <div class="flex items-center">
                        <div id="loader" class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600 mr-3"></div>
                        <span id="statusText" class="font-bold text-slate-700 text-lg">Procesando archivo...</span>
                    </div>
                    <button id="downloadBtn" class="hidden bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition-all flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Descargar Balanza Limpia
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const structureInput = document.getElementById('structureInput');
        const patternInput = document.getElementById('patternInput');
        const statusContainer = document.getElementById('statusContainer');
        const statusText = document.getElementById('statusText');
        const downloadBtn = document.getElementById('downloadBtn');
        const loader = document.getElementById('loader');

        let finalBlob = null;

        // Eventos de Interfaz
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            statusContainer.classList.remove('hidden');
            downloadBtn.classList.add('hidden');
            loader.classList.remove('hidden');
            statusText.innerText = "Analizando Balanza...";

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const buffer = e.target.result;
                    const workbook = new ExcelJS.Workbook();
                    await workbook.xlsx.load(buffer);
                    processBalanza(workbook);
                } catch (err) {
                    statusText.innerText = "Error al leer el archivo. Asegúrate de que sea un .xlsx válido.";
                    loader.classList.add('hidden');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function getNumericValue(cell) {
            if (!cell) return null;
            const val = cell.value;
            if (val === null || val === undefined || val === "") return null;
            if (typeof val === 'object' && val.result !== undefined) return getNumericValue({ value: val.result });
            if (typeof val === 'number') return val;
            let str = val.toString().replace(/[$,\s]/g, "");
            if (str.startsWith('(') && str.endsWith(')')) str = '-' + str.substring(1, str.length - 1);
            let num = parseFloat(str);
            return isNaN(num) ? null : num;
        }

        async function processBalanza(oldWb) {
            const worksheet = oldWb.worksheets[0];
            const structPattern = structureInput.value.trim();
            const regex = new RegExp("^(" + structPattern.replace(/X/g, '\\d') + ")");
            const majorPattern = patternInput.value.trim();
            const accountLen = structPattern.length;

            const newWb = new ExcelJS.Workbook();
            const newWs = newWb.addWorksheet('Balanza COI');

            let metaRows = [];
            let accountData = [];
            let totalRows = [];
            let lastUserRow = null; 
            let foundFirstAccount = false;

            // FASE 1: Clasificación de Datos
            worksheet.eachRow({ includeEmpty: true }, (row) => {
                let isAccountRow = false;
                let accountColNum = -1;
                let foundAccountVal = "";

                // Verificamos si la fila contiene una cuenta contable
                row.eachCell({ includeEmpty: true }, (cell, colNum) => {
                    let val = (cell.value || "").toString().trim();
                    if (regex.test(val)) {
                        isAccountRow = true;
                        foundAccountVal = val;
                        accountColNum = colNum;
                    }
                });

                if (isAccountRow) {
                    foundFirstAccount = true;
                    let cuenta = foundAccountVal.substring(0, accountLen).trim();
                    let desc = foundAccountVal.substring(accountLen).trim();
                    if (desc === "") desc = (row.getCell(accountColNum + 1).value || "").toString().trim();

                    let importes = [];
                    row.eachCell({ includeEmpty: true }, (cell, colNum) => {
                        if (colNum > accountColNum + 1 || (desc !== "" && colNum > accountColNum)) {
                            let v = getNumericValue(cell);
                            if (v !== null && importes.length < 4) importes.push(v);
                        }
                    });
                    while(importes.length < 4) importes.push(0);
                    accountData.push({ cuenta, desc, importes });
                } else {
                    let rowStr = "";
                    row.eachCell(c => rowStr += " " + (c.value || ""));
                    
                    if (!foundFirstAccount) {
                        let text = rowStr.trim();
                        if (text !== "" && !text.toUpperCase().includes("NO. DE CUENTA")) {
                            metaRows.push(text);
                        }
                    } else if (rowStr.toUpperCase().includes("TOTAL")) {
                        let label = "";
                        let vals = [];
                        row.eachCell({ includeEmpty: true }, (c) => {
                            let v = getNumericValue(c);
                            if (v !== null) vals.push(v);
                            else if (c.value && label === "" && !c.value.toString().toUpperCase().includes("MONEDA")) {
                                label = c.value.toString().trim();
                            }
                        });
                        if (label !== "" || vals.length > 0) {
                            totalRows.push({ label, vals });
                        }
                    } else if (rowStr.toUpperCase().includes("USUARIO")) {
                        let rowData = [];
                        // Capturamos hasta 10 columnas del pie de página para no perder nada a la derecha
                        for(let i = 1; i <= 10; i++) {
                            rowData.push(row.getCell(i).value);
                        }
                        lastUserRow = rowData;
                    }
                }
            });

            // FASE 2: Escritura en el nuevo Libro
            
            // 1. Escribir Encabezados (A:F)
            metaRows.forEach((text) => {
                const r = newWs.addRow([text]);
                newWs.mergeCells(`A${r.number}:F${r.number}`);
                r.getCell(1).alignment = { horizontal: 'left' };
                r.font = { bold: true, name: 'Arial', size: 11 };
            });

            newWs.addRow([]); // Espacio

            // 2. Encabezado de Tabla
            const headRow = newWs.addRow(["No. De cuenta", "Descripción", "Saldo Inicial", "Debe", "Haber", "Saldo Final"]);
            headRow.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            headRow.eachCell(c => {
                c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF334155' } }; // Azul oscuro Slate-700
                c.alignment = { horizontal: 'center' };
            });

            // 3. Escribir Cuentas
            accountData.forEach(item => {
                const r = newWs.addRow([item.cuenta, item.desc, ...item.importes]);
                if (item.cuenta.includes(majorPattern)) {
                    r.font = { name: 'Arial', size: 12, bold: true };
                    r.height = 20;
                } else {
                    r.font = { name: 'Arial', size: 10 };
                }
            });

            // 4. Totales
            if (totalRows.length > 0) {
                newWs.addRow([]);
                totalRows.forEach(tr => {
                    const r = newWs.addRow(["", tr.label, ...tr.vals]);
                    r.font = { bold: true, size: 11 };
                    r.eachCell((c, i) => {
                        if (i >= 3) c.numFmt = '#,##0.00;[Red]-#,##0.00';
                    });
                });
            }

            // 5. Usuario (Pie de Página)
            if (lastUserRow) {
                newWs.addRow([]);
                const userRow = newWs.addRow(lastUserRow);
                userRow.font = { size: 9, italic: true, color: { argb: 'FF475569' } };
            }

            // Configuración Global de Columnas
            newWs.columns = [
                { width: 22 }, { width: 50 }, { width: 18 }, { width: 18 }, { width: 18 }, { width: 18 }
            ];

            // Formato Numérico General
            newWs.eachRow((row, rowNum) => {
                if (rowNum > metaRows.length + 2) {
                    for(let i = 3; i <= 6; i++) {
                        const cell = row.getCell(i);
                        if (typeof cell.value === 'number') {
                            cell.numFmt = '#,##0.00;[Red]-#,##0.00';
                        }
                    }
                }
            });

            // Generar el Blob para descarga
            finalBlob = await newWb.xlsx.writeBuffer();
            loader.classList.add('hidden');
            statusText.innerText = "¡Balanza procesada con éxito!";
            downloadBtn.classList.remove('hidden');
        }

        downloadBtn.addEventListener('click', () => {
            if (finalBlob) {
                const blob = new Blob([finalBlob], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Balanza_COI.xlsx';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        });
    </script>
</body>
</html>
